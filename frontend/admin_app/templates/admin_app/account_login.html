{% extends 'base.html' %}
{% block content %}
<section class="panel">
  <h1>Admin account sign in</h1>
  {% if account_error %}<p class="error" role="alert">{{ account_error }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label>Admin email (optional for configured system administrator)<input name="email" type="email" autocomplete="username"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
