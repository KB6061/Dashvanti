{% extends 'admin_app/admin_base.html' %}{% load static %}{% block admin_content %}
<link rel="stylesheet" href="{% static 'account-identity.css' %}"><h1>Account Verification</h1>{% if account_error %}<p class="account-error">{{ account_error }}</p>{% endif %}<form method="post" class="admin-panel" data-no-ajax="true">{% csrf_token %}<label>User ID<input name="user_id" type="number" min="1" required></label><label><input name="verified" type="checkbox">Verified restaurant, driver or customer</label><label>Verification evidence / reason<input name="reason" maxlength="500" minlength="3" required></label><button>Save verification</button></form>
{% endblock %}
