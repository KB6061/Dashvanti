{% extends 'base.html' %}
{% block content %}
<section class="form-card">
  <p class="eyebrow">Dashvanti admin</p>
  <h1>Admin Login</h1>
  {% if error %}<p class="errorlist">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Password
      <input type="password" name="password" required autofocus>
    </label>
    <button class="btn btn-primary">Login</button>
  </form>
</section>
{% endblock %}
