{% extends 'base.html' %}{% block content %}<section class="card"><h1>Verify your sign-in</h1><p>Enter the six-digit code from your authenticator app.</p>{% if error %}<p class="text-danger" role="alert">{{ error }}</p>{% endif %}<form method="post" data-no-ajax="true">{% csrf_token %}<label>Authenticator code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus></label><button>Verify &amp; sign in</button></form><a href="/customer/login">Back to login</a></section>{% endblock %}
