<form method="post" class="account-card" data-no-ajax="true" data-ticket-create enctype="multipart/form-data">{% csrf_token %}<input name="action" value="support_create" type="hidden"><p>Ticket number is assigned automatically · {{ account.user.name }} · Customer {{ account.user.id }}</p><div class="account-form-grid"><label>Category<select name="category" required>{% for category in account.support_categories %}<option>{{ category }}</option>{% endfor %}</select></label><label>Subcategory<input name="subcategory" maxlength="120"></label><label>Priority<select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option><option>Emergency</option></select></label><label>Order (optional)<select name="order_id"><option value="">General support</option>{% for order in account.orders %}<option value="{{ order.id }}">Order -{{ order.id }} · {{ order.restaurant_name }}</option>{% endfor %}</select></label></div><label>How can we help?<textarea name="description" maxlength="10000" required></textarea></label><label>Attachments (optional)<input name="attachments" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple></label><button>Create ticket</button></form>
{% include 'account_components/ticket_list.html' %}
