<div class="account-form-grid"><label>Type<select name="address_type"><option>Home</option><option {% if address.address_type == 'Work' %}selected{% endif %}>Work</option><option {% if address.address_type == 'Other' %}selected{% endif %}>Other</option></select></label><label>Nickname<input name="label" value="{{ address.label }}" maxlength="80" required></label><div class="account-address-search"><label>Search address<gmp-place-autocomplete data-account-address-search placeholder="Start typing your street or address"></gmp-place-autocomplete></label><small role="status" aria-live="polite" data-account-address-status></small></div><label>Full address<textarea name="details" maxlength="500" required>{{ address.details }}</textarea></label><label>Apartment<input name="apartment" value="{{ address.apartment }}" maxlength="100"></label><label>Landmark<input name="landmark" value="{{ address.landmark }}" maxlength="150"></label><label>City<input name="city" value="{{ address.city }}" maxlength="100"></label><label>State<input name="state" value="{{ address.state }}" maxlength="100"></label><label>Zip code<input name="zip_code" value="{{ address.zip_code }}" maxlength="20"></label><label>Country<select name="country"><option value="US">United States</option><option value="IN" {% if address.country == 'IN' %}selected{% endif %}>India</option></select></label><label>Latitude<input name="latitude" type="number" step="any" min="-90" max="90" value="{{ address.latitude|default:'' }}"></label><label>Longitude<input name="longitude" type="number" step="any" min="-180" max="180" value="{{ address.longitude|default:'' }}"></label><label>Delivery instructions<textarea name="instructions" maxlength="500">{{ address.instructions }}</textarea></label><label><input name="is_default" type="checkbox" {% if address.is_default %}checked{% endif %}> Default address</label></div>
