<div class="account-profile-intro account-card"><span class="account-avatar" data-account-avatar>{% if account.avatar %}<img src="{{ account.avatar }}" alt="{{ account.user.name }}" data-user-avatar>{% else %}{{ account.user.name|first }}{% endif %}</span><div><h3 data-account-name>{{ account.user.name }}</h3>{% if account.verified or request.session.auth_provider == 'google' %}<span class="account-verified">✓ Verified</span>{% endif %}</div></div>
