{% extends 'base.html' %}{% load static %}{% block content %}
<link rel="stylesheet" href="{% static 'account-identity.css' %}"><script src="{% static 'incident-center.js' %}" defer></script><section class="card"><h1>Support Center</h1><p data-incident-status role="status"></p><form data-ticket-create>{% csrf_token %}<label>Category<input name="category" maxlength="120" required></label><label>Subcategory<input name="subcategory" maxlength="120"></label><label>Priority<select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option><option>Emergency</option></select></label><label>Order<select name="order_id"><option value="">General support</option>{% for order in orders %}<option value="{{ order.id }}">Order -{{ order.id }} · {{ order.restaurant_name }}</option>{% endfor %}</select></label><label>Description<textarea name="description" maxlength="10000" required></textarea></label><label>Attachments<input name="attachments" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"></label><button>Create ticket</button></form><div data-incident-list>{% include 'account_components/ticket_list.html' %}</div></section>
{% endblock %}
