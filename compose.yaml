services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD}
      APP_USER: dashvanti
      APP_USER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [oracle_data:/opt/oracle/oradata]
    healthcheck:
      test: [CMD, healthcheck.sh]
      interval: 15s
      timeout: 10s
      retries: 40
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka_data:/var/lib/kafka/data]
  mailpit:
    image: axllent/mailpit:v1.22
    ports: ["127.0.0.1:8025:8025"]
  migrate:
    build: .
    env_file: .env
    command: [python, -m, backend.migrate]
    depends_on:
      oracle: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    volumes: [uploads:/opt/dashvanti_fs]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: [python, -m, backend.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_started}
      mailpit: {condition: service_started}
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    working_dir: /app/frontend
    command: [uvicorn, config.asgi:application, --host, 0.0.0.0, --port, "8000"]
    volumes: [sessions:/tmp/dashvanti_sessions]
    depends_on: [api]
    restart: unless-stopped
  gateway:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8000:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/static:/srv/static:ro
    depends_on: [web]
    restart: unless-stopped
volumes:
  oracle_data:
  kafka_data:
  uploads:
  sessions:

